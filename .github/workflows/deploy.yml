name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # ⛔ PER PUBBLICARE SUL DOMINIO PROPRIO NON BASTA SCOMMENTARE QUI SOTTO.
      #
      # `NEXT_PUBLIC_DOMINIO_SITO` fa tre cose insieme: toglie il prefisso
      # /fibonacci-website dai link e dagli asset, porta SITE_URL sul dominio, e
      # scrive `out/CNAME` — che e' come GitHub Pages sa quale dominio servire.
      #
      # ⚠️ Da quel momento Pages **reindirizza github.io al dominio**. Se il DNS
      # non punta ancora a Pages, il risultato non e' «il sito e' ancora su
      # github.io»: e' **il sito non e' piu' raggiungibile da nessuna parte**.
      #
      # Misurato il 2026-08-11: `fibonaccimedica.it` e `.com` risolvono a
      # 2.57.91.91 (Hostinger) e servono una pagina di **dominio parcheggiato**.
      # GitHub Pages sta su 185.199.108-111.153.
      #
      # ORDINE CORRETTO — il DNS PRIMA, questa riga DOPO:
      #   1. su Hostinger, per fibonaccimedica.it: sostituire il record A con i
      #      quattro di Pages (185.199.108.153, .109.153, .110.153, .111.153) e
      #      mettere `www` come CNAME -> firmamento-technologies.github.io
      #   2. verificare: `dig +short fibonaccimedica.it` deve dare i 185.199.*
      #   3. solo allora scommentare la riga `env:` qui sotto e rilasciare
      #   4. attendere che Pages emetta il certificato TLS per il dominio
      #
      # - run: npm run build
      #   env:
      #     NEXT_PUBLIC_DOMINIO_SITO: fibonaccimedica.it
      # 🔴 **ATTENZIONE, misurato il 2026-08-16: questo artefatto NON è ciò che
      #    serve `fibonaccimedica.it`.** Il DNS punta a `188.213.175.26` (la
      #    macchina Aruba) e Caddy serve `/var/www/fibonaccimedica`, una
      #    **cartella locale sincronizzata a mano**. Pages resta in piedi e
      #    risponde su `firmamento-technologies.github.io`, ⛔ ma un rilascio
      #    che finisce qui e basta **non è online**: serve anche la copia sulla
      #    macchina. ⇒ le variabili qui sotto vanno tenute uguali a quelle con
      #    cui si costruisce la copia che viene sincronizzata, o le due
      #    versioni divergono senza che niente diventi rosso.
      - run: npm run build
        env:
          # Il canale di contatto (TD-166): vuoto ⇒ il modulo sulla scheda del
          # medico ⛔ non esiste. ⚠️ È un host diverso dal sito, quindi la
          # chiamata è cross-origin e vive solo se l'origine è in
          # `ALLOWED_ORIGINS` del sidecar. Verificato il 2026-08-16.
          NEXT_PUBLIC_CONTATTO_API_URL: https://app.fibonaccimedica.it
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
